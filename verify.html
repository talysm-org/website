<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talysm — Confirm your launch notification</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>
  :root{--bg:#000; --ink:#f4f4f2; --dim:#9a9a96; --line:#26262a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  main{max-width:560px; padding:40px 28px; text-align:center}
  .kicker{font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--dim)}
  h1{
    margin-top:22px; font-size:clamp(26px,5vw,42px); font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; line-height:1.15;
  }
  p{margin-top:20px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); line-height:2}
  a{color:var(--ink)}
  .home-logo{text-align:center; margin-bottom:28px}
  .home-logo img{height:56px; width:56px; display:inline-block}
  .home-link{margin-top:28px}
  .home-link a{text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; transition:border-color .25s ease}
  .home-link a:hover{border-color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="home-logo"><a href="https://talysm.com/" aria-label="Talysm — return to home"><img alt="Talysm" src="/apple-touch-icon.png"></a></div>
  <div class="kicker">Launch notification</div>
  <h1 id="title">Confirming…</h1>
  <p id="note">One moment.</p>
  <p class="home-link"><a href="https://talysm.com/">Return to Home</a></p>
</main>
<script>
const SU_PUB = "MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAubC8j3PAsrNYhdABjGUi+Mf9saZh8r1Pc46PCn2Oa3q7dWks7uCi0Z6D42Lg6mGtNADZ4V7952C5jqfzfpAuWo2N3jfBMoGyi0N1G2BExOPAFH2WB6Ybqex23zjq4tX1o7M3xtEzgr+VnGsxgLKlRfnnS37uEQS0z0lXuUj6tErSt8dL5gveLLBZ1Xh3moP8iBHpUjvbkGGhqUZ98bKtYGr46CBMJMdpRdMu6N+IPW5BBuJMH75wb+u2DRoCpZ3en77WUQ4rB3HSVnvKtH0i82Y2hjoHp+9uNVTNchi6cL9I4FMITefXMEONL0wbMETH6TyJ0i9EVc576nA6zyD7KQ4eLYbyB2AkwxsifzNlHRLUDhH6BDqXVvQP/E6IKTfpnpSDLfS0OLmjcvxpzk5Vs897TY0KTVgPau8clJSeDlKjJJSb8gMs8RdHtHpy6x6laUZAymYmgQyOP2ZYzm3OhCpdshZmKn9fVUbQ4Jv2TewaNu4s/Z9lhgMbPANiVrCWewz3/rTWB7Q9cy6vawToSXU2NdpxKbdI4mZm2800rgpTSLaEabFDNtk3Cg/YCF0rCj1c7e+yDGgc8V+PUsAxqAPB3vBMcNw3Ikw6f1/B/RgOflVfEJOPQx5fG/b3o2BWHXChxyhMhp5xGZBFNYeys31brqWRlp3hjUgEL+I4wRcCAwEAAQ==";
const SU_PAT = atob("Z2l0aHViX3BhdF8xMUNSSkREVUEwZzVub2kxZUFDOGxQX2x3TW5vSkZRNXlLZA==") + atob("VUR0c1lCejlFVkJITmMxSE1LdUNoTU9VTzV5S3dVOTI1VVNOU1VSWG5UVnIyYVk=");
const SU_API = "https://api.github.com/repos/talysm-org/launch/actions/workflows/";
const SU_HDRS = {
  "Authorization": "Bearer " + SU_PAT,
  "Accept": "application/vnd.github+json",
  "X-GitHub-Api-Version": "2022-11-28",
  "Content-Type": "application/json"
};

function suB64(buf){
  let s = "";
  new Uint8Array(buf).forEach(b => s += String.fromCharCode(b));
  return btoa(s);
}

async function suEncrypt(obj){
  const der = Uint8Array.from(atob(SU_PUB), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey("spki", der, {name:"RSA-OAEP", hash:"SHA-256"}, false, ["encrypt"]);
  return suB64(await crypto.subtle.encrypt({name:"RSA-OAEP"}, key, new TextEncoder().encode(JSON.stringify(obj))));
}
const title = document.getElementById('title');
const note = document.getElementById('note');
const t = new URLSearchParams(location.search).get('t') || '';

function show(t1, t2){ title.textContent = t1; note.textContent = t2; }

async function poll(nonce, attempts){
  for (let i = 0; i < attempts; i++){
    try {
      const r = await fetch(SU_API + "signup-verify.yml/runs?per_page=10", {headers: SU_HDRS});
      const d = await r.json();
      const run = (d.workflow_runs || []).find(x => x.display_title === "confirm " + nonce);
      if (run && run.status === "completed"){
        return run.conclusion === "success" ? "ok" : "fail";
      }
    } catch(e){}
    await new Promise(res => setTimeout(res, 3000));
  }
  return "timeout";
}

(async function(){
  if (!t || t.length > 80){
    return show("Link incomplete", "This confirmation link is not valid.");
  }
  if (SU_PAT === "PH1PH2"){
    return show("Almost there", "Confirmation is temporarily unavailable. Please try again shortly.");
  }
  const nonce = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  try {
    const p = await suEncrypt({t: t});
    const r = await fetch(SU_API + "signup-verify.yml/dispatches", {
      method: "POST", headers: SU_HDRS,
      body: JSON.stringify({ref: "main", inputs: {p: p, n: nonce}})
    });
    if (r.status !== 204) throw 0;
  } catch(e){
    return show("Not confirmed", "This link is invalid or has expired. Please sign up again.");
  }
  const res = await poll(nonce, 20);
  if (res === "ok") return show("Confirmed", "You are on the list. One email — when Talysm launches.");
  if (res === "fail") return show("Not confirmed", "This link is invalid or has expired. Please sign up again.");
  return show("Almost there", "Your confirmation is being processed. If in doubt, sign up again.");
})();
</script>
</body>
</html>
